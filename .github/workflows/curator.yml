name: Anti-Algorithm Curator Bot

on:
  schedule:
    # UTC 기준: 화요일(2), 금요일(5) 23:51
    # (한국 시간 기준: 매주 수요일, 토요일 아침 08:51 KST)
    - cron: '51 23 * * 2,5'
  
  # 수동으로 실행해볼 수 있는 버튼 추가
  workflow_dispatch:

jobs:
  run-curator:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-genai requests

      - name: 큐레이터 스크립트 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python curator.py
